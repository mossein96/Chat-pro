<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat Pro</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f4f4;
    }

    header {
      background: #128c7e;
      color: white;
      padding: 20px;
      text-align: center;
    }

    #messages {
      height: 65vh;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      background: white;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      padding: 10px;
      background: white;
    }

    input {
      flex: 1;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 20px;
    }

    button {
      margin-left: 10px;
      padding: 15px 20px;
      border: none;
      border-radius: 20px;
      background: #128c7e;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <header>
    <h2>Chat Pro</h2>
  </header>

  <div id="messages">
    <div class="message">
      Welcome to Chat Pro! 👋
    </div>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="messageInput"
      placeholder="Type a message..."
    >

    <button onclick="sendMessage()">
      Send
    </button>
  </div>

  <script src="app.js"></script>

</body>
</html>
