<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
    }

    header {
      background: #1f1f1f;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    .welcome {
      text-align: center;
      margin: 20px 0;
    }

    .welcome h2 {
      color: #4caf50;
    }

    #chatBox {
      height: 400px;
      overflow-y: auto;
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #333;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      max-width: 80%;
    }

    .bot {
      background: #333;
    }

    .user {
      background: #2e7d32;
      margin-left: auto;
      text-align: right;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    💬 Chat Pro
  </header>

  <div class="container">

    <div class="welcome">
      <h2>Welcome to Chat Pro</h2>
      <p>Chat with your personal assistant.</p>
    </div>

    <div id="chatBox">
      <div class="message bot">
        Hello! 👋 Welcome to Chat Pro. How can I help you today?
      </div>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="Type your message..."
      >

      <button onclick="sendMessage()">
        Send
      </button>
    </div>

  </div>

  <footer>
    Chat Pro © 2026
  </footer>

  <script>
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const chatBox = document.getElementById("chatBox");
      const message = input.value.trim();

      if (message === "") {
        return;
      }

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = message;

      chatBox.appendChild(userMessage);

      input.value = "";

      setTimeout(function () {
        const botMessage = document.createElement("div");
        botMessage.className = "message bot";
        botMessage.textContent =
          "Thanks for your message! Chat Pro is still being developed.";

        chatBox.appendChild(botMessage);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 700);

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document
      .getElementById("messageInput")
      .addEventListener("keypress", function (event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      });
  </script>

</body>
</html>
