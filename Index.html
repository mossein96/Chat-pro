<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Chat Pro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111827;
      color: white;
    }

    .app {
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      background: #1f2937;
    }

    header {
      background: #2563eb;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 24px;
    }

    .online {
      font-size: 13px;
      color: #bbf7d0;
    }

    .search {
      padding: 15px;
    }

    .search input {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    .section-title {
      padding: 10px 20px;
      color: #9ca3af;
      font-size: 14px;
    }

    .chat {
      display: flex;
      align-items: center;
      padding: 15px 20px;
      border-bottom: 1px solid #374151;
      cursor: pointer;
    }

    .chat:hover {
      background: #374151;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-right: 15px;
    }

    .chat-info {
      flex: 1;
    }

    .chat-name {
      font-weight: bold;
      font-size: 17px;
    }

    .last-message {
      color: #9ca3af;
      margin-top: 5px;
      font-size: 14px;
    }

    .time {
      color: #9ca3af;
      font-size: 12px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 500px;
      background: #111827;
      display: flex;
      justify-content: space-around;
      padding: 15px 5px;
      border-top: 1px solid #374151;
    }

    .nav-item {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      cursor: pointer;
    }

    .nav-item.active {
      color: #60a5fa;
    }

    .nav-icon {
      font-size: 22px;
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div>
        <h1>💬 Chat Pro</h1>
        <div class="online">● Online</div>
      </div>

      <div style="font-size: 25px;">⚙️</div>
    </header>

    <div class="search">
      <input
        type="text"
        placeholder="Search conversations..."
        id="search"
      >
    </div>

    <div class="section-title">
      MESSAGES
    </div>

    <div id="chatList">

      <div class="chat">
        <div class="avatar">A</div>

        <div class="chat-info">
          <div class="chat-name">Alex</div>
          <div class="last-message">Hello! How are you?</div>
        </div>

        <div class="time">10:30</div>
      </div>

      <div class="chat">
        <div class="avatar">S</div>

        <div class="chat-info">
          <div class="chat-name">Sarah</div>
          <div class="last-message">See you tomorrow!</div>
        </div>

        <div class="time">09:15</div>
      </div>

      <div class="chat">
        <div class="avatar">J</div>

        <div class="chat-info">
          <div class="chat-name">John</div>
          <div class="last-message">Thanks for your message.</div>
        </div>

        <div class="time">Yesterday</div>
      </div>

    </div>

    <div class="bottom-nav">

      <div class="nav-item active">
        <span class="nav-icon">💬</span>
        Chats
      </div>

      <div class="nav-item">
        <span class="nav-icon">👥</span>
        People
      </div>

      <div class="nav-item">
        <span class="nav-icon">➕</span>
        New Chat
      </div>

      <div class="nav-item">
        <span class="nav-icon">👤</span>
        Profile
      </div>

    </div>

  </div>

  <script>

    const search = document.getElementById("search");

    search.addEventListener("input", function () {

      const value = search.value.toLowerCase();

      const chats = document.querySelectorAll(".chat");

      chats.forEach(function (chat) {

        const name =
          chat.querySelector(".chat-name")
              .textContent
              .toLowerCase();

        if (name.includes(value)) {
          chat.style.display = "flex";
        } else {
          chat.style.display = "none";
        }

      });

    });

  </script>

</body>
</html>
