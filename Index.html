<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#075e54">

  <title>Chat Pro</title>

  <!-- Firebase (Storage removed) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Emoji Picker -->
  <script type="module"
    src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js">
  </script>

  <!-- ===== ALL CSS INLINED ===== -->
  <style>
    /* =====================================================
       CHAT PRO - WHATSAPP STYLE
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #efeae2;
      color: #111b21;

      overflow: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }


    /* =====================================================
       AUTH
    ===================================================== */

    .auth-screen {
      width: 100%;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #075e54;

      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 390px;

      background: white;

      padding: 35px 25px;

      border-radius: 12px;

      text-align: center;

      box-shadow:
        0 8px 30px rgba(0,0,0,.25);
    }

    .auth-logo {
      width: 75px;
      height: 75px;

      margin: auto;
      margin-bottom: 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #075e54;

      border-radius: 50%;

      font-size: 40px;
    }

    .auth-box h1 {
      color: #075e54;
      margin-bottom: 5px;
    }

    .auth-subtitle {
      color: #667781;
      margin-bottom: 25px;
    }

    .auth-box input {
      width: 100%;

      padding: 14px;

      margin-bottom: 12px;

      border:
        1px solid #ddd;

      border-radius: 8px;

      outline: none;

      font-size: 15px;
    }

    .auth-box input:focus {
      border-color: #128c7e;
    }

    .auth-login,
    .auth-signup {
      width: 100%;

      padding: 13px;

      margin-top: 5px;

      border-radius: 8px;

      font-size: 15px;

      font-weight: bold;
    }

    .auth-login {
      background: #075e54;
      color: white;
    }

    .auth-signup {
      background: #e9edef;
      color: #075e54;
    }

    #authMessage {
      margin-top: 15px;
      font-size: 13px;
    }


    /* =====================================================
       MAIN APP
    ===================================================== */

    .app {
      width: 100%;
      height: 100vh;

      display: flex;

      background: #efeae2;
    }


    /* =====================================================
       SIDEBAR
    ===================================================== */

    .sidebar {
      width: 35%;
      max-width: 450px;
      min-width: 300px;

      height: 100vh;

      background: #fff;

      border-right:
        1px solid #d1d7db;

      display: flex;
      flex-direction: column;
    }


    /* =====================================================
       SIDEBAR HEADER
    ===================================================== */

    .sidebar-header {
      height: 60px;

      padding: 8px 12px;

      display: flex;
      align-items: center;

      background: #f0f2f5;
    }

    .my-profile {
      flex: 1;

      display: flex;
      align-items: center;

      gap: 10px;

      cursor: pointer;
    }

    .my-profile-info {
      display: flex;
      flex-direction: column;

      gap: 2px;
    }

    .my-profile-info strong {
      font-size: 15px;
    }

    .my-profile-info span {
      font-size: 12px;
      color: #667781;
    }

    .header-icon {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      background: transparent;

      font-size: 19px;
    }

    .header-icon:hover {
      background: #dfe3e5;
    }


    /* =====================================================
       AVATAR
    ===================================================== */

    .avatar-container {
      position: relative;

      width: 45px;
      height: 45px;

      flex-shrink: 0;
    }

    .avatar {
      width: 45px;
      height: 45px;

      border-radius: 50%;

      object-fit: cover;

      background: #dfe5e7;
    }

    .online-dot {
      position: absolute;

      right: -1px;
      bottom: -1px;

      width: 12px;
      height: 12px;

      background: #25d366;

      border:
        2px solid white;

      border-radius: 50%;
    }


    /* =====================================================
       SEARCH
    ===================================================== */

    .search-container {
      height: 48px;

      margin: 8px 10px;

      padding: 0 14px;

      display: flex;
      align-items: center;

      gap: 10px;

      background: #f0f2f5;

      border-radius: 8px;
    }

    .search-icon {
      font-size: 15px;
    }

    .search-container input {
      width: 100%;

      border: none;

      outline: none;

      background: transparent;

      font-size: 14px;
    }


    /* =====================================================
       SEARCH RESULTS
    ===================================================== */

    .search-results {
      max-height: 220px;

      overflow-y: auto;
    }

    .search-result {
      padding: 10px 14px;

      display: flex;
      align-items: center;

      gap: 10px;

      border-bottom:
        1px solid #eee;

      cursor: pointer;
    }

    .search-result:hover {
      background: #f5f5f5;
    }


    /* =====================================================
       NEW CHAT
    ===================================================== */

    .new-chat {
      margin: 0 10px 8px;

      padding: 11px;

      border: none;

      border-radius: 8px;

      background: #075e54;

      color: white;

      font-size: 14px;

      font-weight: bold;
    }

    .new-chat:hover {
      background: #128c7e;
    }

    .new-chat span {
      font-size: 18px;
      margin-right: 5px;
    }


    /* =====================================================
       CHAT TITLE
    ===================================================== */

    .chats-title {
      padding: 8px 15px;

      color: #667781;

      font-size: 11px;

      font-weight: bold;
    }


    /* =====================================================
       ROOM LIST
    ===================================================== */

    .room-list {
      flex: 1;

      overflow-y: auto;
    }

    .room {
      min-height: 70px;

      padding: 10px 15px;

      display: flex;
      align-items: center;

      gap: 12px;

      cursor: pointer;

      border-bottom:
        1px solid #f0f2f5;
    }

    .room:hover {
      background: #f5f6f6;
    }

    .room.active {
      background: #e9edef;
    }

    .room-info {
      flex: 1;

      min-width: 0;
    }

    .room-name {
      margin-bottom: 5px;

      font-size: 15px;

      font-weight: bold;
    }

    .room-last-message {
      color: #667781;

      font-size: 13px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =====================================================
       CHAT
    ===================================================== */

    .chat {
      flex: 1;

      height: 100vh;

      min-width: 0;

      display: flex;
      flex-direction: column;
    }


    /* =====================================================
       CHAT HEADER
    ===================================================== */

    .chat-header {
      height: 60px;

      padding: 7px 12px;

      display: flex;
      align-items: center;

      gap: 10px;

      background: #f0f2f5;

      border-bottom:
        1px solid #d1d7db;
    }

    .back-button {
      display: none;

      width: 38px;
      height: 38px;

      border-radius: 50%;

      background: transparent;

      font-size: 25px;
    }

    .chat-user {
      flex: 1;

      min-width: 0;

      display: flex;
      align-items: center;

      gap: 10px;
    }

    .chat-user-info {
      display: flex;
      flex-direction: column;

      min-width: 0;
    }

    .chat-user-info strong {
      font-size: 15px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .chat-user-info span {
      margin-top: 2px;

      color: #667781;

      font-size: 12px;
    }

    .chat-actions {
      display: flex;
      align-items: center;
    }

    .chat-actions button {
      width: 40px;
      height: 40px;

      border-radius: 50%;

      background: transparent;

      font-size: 19px;
    }

    .chat-actions button:hover {
      background: #dfe3e5;
    }


    /* =====================================================
       MESSAGES AREA
    ===================================================== */

    .messages {
      flex: 1;

      overflow-y: auto;

      padding: 20px 7%;

      background-color: #efeae2;

      background-image:
        radial-gradient(
          #d8d2ca 1px,
          transparent 1px
        );

      background-size: 18px 18px;
    }

    .welcome {
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      color: #667781;
    }

    .welcome-lock {
      font-size: 45px;

      margin-bottom: 15px;
    }

    .welcome h2 {
      color: #41525d;

      margin-bottom: 8px;
    }


    /* =====================================================
       MESSAGE BUBBLES
    ===================================================== */

    .message {
      position: relative;

      max-width: 65%;

      padding: 7px 9px;

      margin: 3px 0 5px;

      border-radius: 7px;

      clear: both;

      word-wrap: break-word;

      box-shadow:
        0 1px 1px rgba(0,0,0,.08);
    }

    .message.sent {
      float: right;

      background: #d9fdd3;

      border-top-right-radius: 2px;
    }

    .message.received {
      float: left;

      background: white;

      border-top-left-radius: 2px;
    }

    .message-text {
      font-size: 14px;

      line-height: 1.45;

      padding-right: 55px;
    }

    .message-time {
      float: right;

      margin-left: 8px;
      margin-top: 5px;

      color: #667781;

      font-size: 10px;
    }

    .message-status {
      margin-left: 3px;

      color: #53bdeb;

      font-size: 13px;
    }

    .message-image {
      max-width: 280px;

      max-height: 350px;

      border-radius: 6px;

      display: block;
    }

    .voice-message {
      min-width: 190px;

      display: flex;
      align-items: center;

      gap: 8px;
    }

    .voice-message audio {
      width: 180px;
    }


    /* =====================================================
       MESSAGE BAR
    ===================================================== */

    .message-bar {
      min-height: 62px;

      padding: 8px 10px;

      display: flex;
      align-items: center;

      gap: 5px;

      background: #f0f2f5;
    }

    .message-icon {
      width: 42px;
      height: 42px;

      min-width: 42px;

      border-radius: 50%;

      background: transparent;

      font-size: 21px;
    }

    .message-icon:hover {
      background: #dfe3e5;
    }

    .message-input {
      flex: 1;

      min-width: 0;

      height: 43px;

      padding: 0 17px;

      border: none;

      outline: none;

      border-radius: 22px;

      background: white;

      font-size: 15px;
    }

    .send-button {
      width: 44px;
      height: 44px;

      min-width: 44px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #075e54;

      color: white;

      font-size: 21px;

      font-weight: bold;
    }

    .send-button:hover {
      background: #128c7e;
    }


    /* =====================================================
       EMOJI PICKER
    ===================================================== */

    .emoji-picker {
      position: fixed;

      left: 10px;
      bottom: 65px;

      z-index: 50;
    }


    /* =====================================================
       PROFILE MODAL
    ===================================================== */

    .modal {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0,0,0,.55);
    }

    .profile-card {
      position: relative;

      width: 100%;
      max-width: 350px;

      padding: 30px 25px;

      background: white;

      border-radius: 12px;

      text-align: center;
    }

    .close-modal {
      position: absolute;

      top: 8px;
      right: 12px;

      background: transparent;

      font-size: 28px;
    }

    .profile-avatar {
      width: 130px;
      height: 130px;

      border-radius: 50%;

      object-fit: cover;

      margin-bottom: 15px;
    }

    .profile-card h2 {
      margin-bottom: 5px;
    }

    .profile-card p {
      color: #667781;
    }

    .change-picture {
      width: 100%;

      padding: 12px;

      margin-top: 20px;

      border-radius: 8px;

      background: #075e54;

      color: white;

      font-size: 14px;

      font-weight: bold;
    }


    /* =====================================================
       CHAT MENU
    ===================================================== */

    .chat-menu {
      position: fixed;

      right: 15px;
      top: 55px;

      z-index: 80;

      width: 190px;

      background: white;

      border-radius: 8px;

      overflow: hidden;

      box-shadow:
        0 5px 25px rgba(0,0,0,.2);
    }

    .chat-menu button {
      width: 100%;

      padding: 13px 15px;

      border: none;

      background: white;

      text-align: left;

      font-size: 14px;
    }

    .chat-menu button:hover {
      background: #f0f2f5;
    }


    /* =====================================================
       CALL SCREEN
    ===================================================== */

    .call-screen {
      position: fixed;

      inset: 0;

      z-index: 300;

      background: #111;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .call-info {
      position: absolute;

      top: 25px;

      left: 0;
      right: 0;

      z-index: 10;

      display: flex;
      flex-direction: column;

      align-items: center;

      color: white;
    }

    .call-info strong {
      font-size: 20px;
    }

    .call-info span {
      margin-top: 5px;

      color: #bbb;

      font-size: 13px;
    }

    #remoteVideo {
      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #222;
    }

    #localVideo {
      position: absolute;

      right: 15px;
      top: 15px;

      width: 140px;
      height: 190px;

      object-fit: cover;

      border:
        2px solid white;

      border-radius: 10px;

      background: #333;
    }

    .call-controls {
      position: absolute;

      bottom: 30px;

      left: 0;
      right: 0;

      display: flex;

      justify-content: center;

      gap: 20px;

      z-index: 20;
    }

    .call-controls button {
      width: 58px;
      height: 58px;

      border-radius: 50%;

      background: #3b3b3b;

      color: white;

      font-size: 22px;
    }

    .call-controls .hangup {
      background: #e53935;

      transform: rotate(135deg);
    }


    /* =====================================================
       DARK MODE
    ===================================================== */

    body.dark {
      background: #111b21;

      color: #e9edef;
    }

    body.dark .sidebar {
      background: #111b21;

      border-color: #374045;
    }

    body.dark .sidebar-header,
    body.dark .chat-header,
    body.dark .message-bar {
      background: #202c33;
    }

    body.dark .search-container {
      background: #2a3942;
    }

    body.dark .search-container input,
    body.dark .message-input {
      color: white;
    }

    body.dark .message-input {
      background: #2a3942;
    }

    body.dark .room {
      border-color: #222d34;
    }

    body.dark .room:hover,
    body.dark .room.active {
      background: #2a3942;
    }

    body.dark .room-last-message,
    body.dark .my-profile-info span,
    body.dark .chat-user-info span {
      color: #8696a0;
    }

    body.dark .messages {
      background-color: #0b141a;
    }

    body.dark .message.received {
      background: #202c33;
      color: #e9edef;
    }

    body.dark .chat-menu,
    body.dark .chat-menu button,
    body.dark .profile-card {
      background: #202c33;

      color: #e9edef;
    }

    body.dark .chat-menu button:hover {
      background: #2a3942;
    }

    body.dark .header-icon:hover,
    body.dark .chat-actions button:hover,
    body.dark .message-icon:hover {
      background: #2a3942;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 700px) {

      .sidebar {
        width: 100%;

        max-width: none;
        min-width: 0;
      }

      .chat {
        width: 100%;
      }

      .app.chat-open .sidebar {
        display: none;
      }

      .app.chat-open .chat {
        display: flex;
      }

      .back-button {
        display: block;
      }

      .messages {
        padding: 15px 10px;
      }

      .message {
        max-width: 82%;
      }

      .message-image {
        max-width: 240px;
      }

      .chat-actions button {
        width: 36px;
        height: 36px;

        font-size: 17px;
      }

      .message-bar {
        padding:
          7px 5px;
      }

      .message-icon {
        width: 38px;
        height: 38px;

        min-width: 38px;

        font-size: 19px;
      }

      .send-button {
        width: 40px;
        height: 40px;

        min-width: 40px;
      }

      #localVideo {
        width: 105px;
        height: 150px;

        right: 10px;
        top: 10px;
      }

      .call-controls {
        bottom: 20px;
      }

    }


    /* =====================================================
       VERY SMALL PHONES
    ===================================================== */

    @media (max-width: 360px) {

      .my-profile-info {
        display: none;
      }

      .chat-actions button {
        width: 33px;
      }

      .message-icon {
        width: 35px;
        min-width: 35px;
      }

      .send-button {
        width: 38px;
        min-width: 38px;
      }

    }
  </style>
</head>

<body>

<!-- =====================================================
     LOGIN / SIGNUP
===================================================== -->

<section id="authScreen" class="auth-screen">

  <div class="auth-box">

    <div class="auth-logo">💬</div>

    <h1>Chat Pro</h1>

    <p class="auth-subtitle">
      Simple. Private. Connected.
    </p>

    <input
      type="email"
      id="email"
      placeholder="Email address"
      autocomplete="email">

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password">

    <button
      class="auth-login"
      onclick="login()">
      Login
    </button>

    <button
      class="auth-signup"
      onclick="signup()">
      Create account
    </button>

    <p id="authMessage"></p>

  </div>

</section>


<!-- =====================================================
     MAIN APPLICATION
===================================================== -->

<main id="app" class="app hidden">

  <!-- ===================================================
       CHAT LIST
  ==================================================== -->

  <aside class="sidebar">

    <header class="sidebar-header">

      <div
        class="my-profile"
        onclick="openProfile()">

        <div class="avatar-container">

          <img
            id="myAvatar"
            class="avatar"
            src=""
            alt="Profile">

          <span
            id="myOnlineDot"
            class="online-dot">
          </span>

        </div>

        <div class="my-profile-info">

          <strong id="myName">
            User
          </strong>

          <span>
            Online
          </span>

        </div>

      </div>

      <button
        class="header-icon"
        onclick="toggleDarkMode()"
        title="Dark mode">
        🌙
      </button>

      <button
        class="header-icon"
        onclick="logout()"
        title="Logout">
        ⋮
      </button>

    </header>


    <!-- SEARCH -->

    <div class="search-container">

      <span class="search-icon">
        🔍
      </span>

      <input
        id="searchInput"
        type="text"
        placeholder="Search or start new chat"
        oninput="searchUsers(this.value)">

    </div>


    <!-- SEARCH RESULTS -->

    <div
      id="searchResults"
      class="search-results">
    </div>


    <!-- NEW CHAT -->

    <button
      class="new-chat"
      onclick="createRoom()">

      <span>＋</span>

      New chat

    </button>


    <div class="chats-title">
      CHATS
    </div>


    <!-- CHAT LIST -->

    <div
      id="roomList"
      class="room-list">
    </div>

  </aside>


  <!-- ===================================================
       CHAT WINDOW
  ==================================================== -->

  <section class="chat">

    <!-- CHAT HEADER -->

    <header class="chat-header">

      <button
        class="back-button"
        onclick="closeChat()">
        ←
      </button>


      <div class="chat-user">

        <div class="avatar-container">

          <img
            id="chatAvatar"
            class="avatar"
            src=""
            alt="User">

          <span
            id="chatOnlineDot"
            class="online-dot hidden">
          </span>

        </div>


        <div class="chat-user-info">

          <strong id="chatName">
            Select a chat
          </strong>

          <span id="chatStatus">
            Start a conversation
          </span>

        </div>

      </div>


      <!-- CALL BUTTONS -->

      <div class="chat-actions">

        <button
          onclick="startAudioCall()"
          title="Voice call">
          📞
        </button>

        <button
          onclick="startVideoCall()"
          title="Video call">
          📹
        </button>

        <button
          onclick="openChatMenu()"
          title="More">
          ⋮
        </button>

      </div>

    </header>


    <!-- =================================================
         MESSAGES
    ================================================== -->

    <div
      id="messages"
      class="messages">

      <div
        id="welcomeMessage"
        class="welcome">

        <div class="welcome-lock">
          🔒
        </div>

        <h2>
          Chat Pro
        </h2>

        <p>
          Select a chat to start messaging.
        </p>

      </div>

    </div>


    <!-- =================================================
         EMOJI PICKER
    ================================================== -->

    <emoji-picker
      id="emojiPicker"
      class="emoji-picker hidden">
    </emoji-picker>


    <!-- =================================================
         MESSAGE BAR
    ================================================== -->

    <div class="message-bar">

      <!-- EMOJI -->

      <button
        class="message-icon"
        onclick="toggleEmojiPicker()"

  /* =========================================================
     DEFAULT AVATAR (SVG)
     ========================================================= */

  function defaultAvatar(name = "User") {
    const letter = (name || "U").trim().charAt(0).toUpperCase();

    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg"
           width="200"
           height="200"
           viewBox="0 0 200 200">
        <rect width="200" height="200" fill="#dfe5e7"/>
        <circle cx="100" cy="75" r="42" fill="#8b979c"/>
        <path d="M35 190c5-48 32-70 65-70s60 22 65 70"
              fill="#8b979c"/>
        <text x="100"
              y="195"
              text-anchor="middle"
              font-size="1"
              fill="transparent">${letter}</text>
      </svg>
    `;

    return "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(svg);
  }

  function setAvatar(element, url, name) {
    if (!element) return;

    element.onerror = function () {
      this.onerror = null;
      this.src = defaultAvatar(name);
    };

    element.src = url || defaultAvatar(name);
  }


  /* =========================================================
     AUTH
     ========================================================= */

  function showAuthMessage(message, error = true) {
    if (!authMessage) return;

    authMessage.textContent = message;
    authMessage.style.color = error ? "#e53935" : "#128c7e";
  }


  async function signup() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      showAuthMessage("Enter email and password.");
      return;
    }

    if (password.length < 6) {
      showAuthMessage("Password must be at least 6 characters.");
      return;
    }

    try {
      showAuthMessage("Creating account...", false);

      const result = await auth.createUserWithEmailAndPassword(
        email,
        password
      );

      const user = result.user;

      const name =
        prompt("Enter your name:") ||
        email.split("@")[0] ||
        "User";

      await db.collection("users").doc(user.uid).set({
        uid: user.uid,
        name: name,
        email: email.toLowerCase(),
        photoBase64: "", // store base64 avatar
        online: true,
        lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      showAuthMessage("Account created!", false);

    } catch (error) {
      console.error(error);
      showAuthMessage(error.message);
    }
  }


  async function login() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      showAuthMessage("Enter email and password.");
      return;
    }

    try {
      showAuthMessage("Logging in...", false);

      await auth.signInWithEmailAndPassword(
        email,
        password
      );

    } catch (error) {
      console.error(error);
      showAuthMessage(error.message);
    }
  }


  async function logout() {
    try {
      if (currentUser) {
        await updateOnlineStatus(false);
      }

      await auth.signOut();

    } catch (error) {
      console.error(error);
    }
  }


  /* =========================================================
     AUTH STATE
     ========================================================= */

  auth.onAuthStateChanged(async user => {

    currentUser = user;

    if (user) {

      authScreen.classList.add("hidden");
      app.classList.remove("hidden");

      await ensureUserProfile();

      loadMyProfile();
      startOnlineStatus();

    } else {

      authScreen.classList.remove("hidden");
      app.classList.add("hidden");

      cleanupListeners();
      cleanupCall();

      currentRoom = null;
      currentChatUser = null;
    }
  });


  /* =========================================================
     ENSURE PROFILE
     ========================================================= */

  async function ensureUserProfile() {

    if (!currentUser) return;

    const ref = db.collection("users").doc(currentUser.uid);
    const snap = await ref.get();

    if (!snap.exists) {

      await ref.set({
        uid: currentUser.uid,
        name: currentUser.email.split("@")[0],
        email: currentUser.email.toLowerCase(),
        photoBase64: "",
        online: true,
        lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  }


  /* =========================================================
     PROFILE
     ========================================================= */

  function loadMyProfile() {

    if (!currentUser) return;

    if (profileListener) {
      profileListener();
    }

    profileListener = db
      .collection("users")
      .doc(currentUser.uid)
      .onSnapshot(snapshot => {

        if (!snapshot.exists) return;

        const data = snapshot.data();

        const name = data.name || "User";
        const photo = data.photoBase64 || "";

        myName.textContent = name;

        setAvatar(
          myAvatar,
          photo,
          name
        );
      });
  }


  function openProfile() {

    if (!currentUser) return;

    profileModal.classList.remove("hidden");

    profileName.textContent =
      myName.textContent || "User";

    profileEmail.textContent =
      currentUser.email || "";

    setAvatar(
      profileAvatar,
      myAvatar.src,
      myName.textContent
    );

    addProfilePictureButton();
  }


  function closeProfile() {
    profileModal.classList.add("hidden");
  }


  function addProfilePictureButton() {

    const card = profileModal.querySelector(".modal-card");

    if (!card) return;

    let button = document.getElementById(
      "changeProfilePictureBtn"
    );

    if (!button) {

      button = document.createElement("button");

      button.id = "changeProfilePictureBtn";
      button.textContent = "📷 Change Profile Picture";

      button.style.cssText = `
        margin-top:15px;
        width:100%;
        padding:12px;
        border:0;
        border-radius:10px;
        background:#075e54;
        color:white;
        font-size:15px;
        cursor:pointer;
      `;

      button.onclick = changeProfilePicture;

      card.appendChild(button);

  }


  function changeProfilePicture() {

    if (!currentUser) return;

    const input = document.createElement("input");

    input.type = "file";
    input.accept = "image/*";

    input.onchange = async event => {

          });

        );

        );

          );

          button.textContent =

          button.disabled = false;

  /* =========================================================
     ONLINE STATUS
     ========================================================= */

  async function updateOnlineStatus(online) {

    if (!currentUser) return;

    try {

      await db
        .collection("users")
        .doc(currentUser.uid)
        .update({
          online: online,
          lastSeen:
            firebase.firestore.FieldValue.serverTimestamp()
        });

    } catch (error) {
      console.error(error);
    }
  }


  function startOnlineStatus() {

    if (onlineInterval) {
      clearInterval(onlineInterval);
    }

    updateOnlineStatus(true);

    onlineInterval = setInterval(() => {
      updateOnlineStatus(true);
    }, 30000);
  }


  window.addEventListener("beforeunload", () => {

    if (currentUser) {
      updateOnlineStatus(false);
    }
  });


  /* =========================================================
     ROOM ID
     ========================================================= */

  function makeRoomId(uid1, uid2) {

    return [uid1, uid2]
      .sort()
      .join("_");
  }


  /* =========================================================
     CREATE ROOM
     ========================================================= */

  async function createRoom() {

    if (!currentUser) return;

    const email = prompt(
      "Enter the email of the person you want to chat with:"
    );

    if (!email) return;

    try {

      const snapshot = await db
        .collection("users")
        .where(
          "email",
          "==",
          email.trim().toLowerCase()
        )
        .limit(1)
        .get();

      if (snapshot.empty) {
        alert("User not found.");
        return;
      }

      const userDoc = snapshot.docs[0];

      if (userDoc.id === currentUser.uid) {
        alert("You cannot chat with yourself.");
        return;
      }

      await createRoomWithUser(
        userDoc.id,
        userDoc.data()
      );

    } catch (error) {

      console.error(error);
      alert(error.message);
    }
  }


  async function createRoomWithUser(uid, userData) {

    const roomId = makeRoomId(
      currentUser.uid,
      uid
    );

    const myProfile =
      await db
        .collection("users")
        .doc(currentUser.uid)
        .get();

    const myData = myProfile.exists
      ? myProfile.data()
      : {};

    await db
      .collection("rooms")
      .doc(roomId)
      .set({

        participants: [
          currentUser.uid,
          uid
        ],

        participantNames: {
          [currentUser.uid]:
            myData.name ||
            currentUser.email.split("@")[0],

          [uid]:
            userData.name ||
            userData.email ||
            "User"
        },

        participantPhotos: {
          [currentUser.uid]:
            myData.photoBase64 || "",

          [uid]:
            userData.photoBase64 || ""
        },

        lastMessage: "",
        lastMessageType: "text",

        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp(),

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      }, {
        merge: true
      });

    openRoom(
      roomId,
      uid,
      userData
    );
  }


  /* =========================================================
     LOAD ROOMS
     ========================================================= */

  function loadRooms() {

    if (!currentUser) return;

    if (roomsListener) {
      roomsListener();
    }

    roomsListener = db
      .collection("rooms")
      .where(
        "participants",
        "array-contains",
        currentUser.uid
      )
      .onSnapshot(snapshot => {

        const rooms = [];

        snapshot.forEach(doc => {

          rooms.push({
            id: doc.id,
            ...doc.data()
          });
        });

        rooms.sort((a, b) => {

          const aTime =
            a.updatedAt &&
            a.updatedAt.toMillis
              ? a.updatedAt.toMillis()
              : 0;

          const bTime =
            b.updatedAt &&
            b.updatedAt.toMillis
              ? b.updatedAt.toMillis()
              : 0;

          return bTime - aTime;
        });

        renderRooms(rooms);

      }, error => {

        console.error(
          "Rooms error:",
          error
        );
      });
  }


  function renderRooms(rooms) {

    roomList.innerHTML = "";

    if (!rooms.length) {

      roomList.innerHTML = `
        <div style="
          padding:25px;
          text-align:center;
          color:#888;
        ">
          No chats yet.<br>
          Tap <b>New Chat</b> to start.
        </div>
      `;

      return;
    }

    rooms.forEach(room => {

      const otherUid =
        room.participants.find(
          uid => uid !== currentUser.uid
        );

      if (!otherUid) return;

      const name =
        room.participantNames?.[otherUid] ||
        "User";

      const photo =
        room.participantPhotos?.[otherUid] ||
        "";

      const div =
        document.createElement("div");

      div.className = "room";

      if (room.id === currentRoom) {
        div.classList.add("active");
      }

      div.innerHTML = `
        <div class="avatar-wrapper">
          <img class="avatar room-avatar">
        </div>

        <div class="room-info">
          <div class="room-name">
            ${escapeHTML(name)}
          </div>

          <div class="room-last-message">
            ${escapeHTML(
              room.lastMessage || "No messages yet"
            )}
          </div>
        </div>
      `;

      const avatar =
        div.querySelector(".room-avatar");

      setAvatar(
        avatar,
        photo,
        name
      );

      div.onclick = async () => {

        try {

          const userSnap =
            await db
              .collection("users")
              .doc(otherUid)
              .get();

          const userData = userSnap.exists
            ? userSnap.data()
            : {
                uid: otherUid,
                name: name,
                photoBase64: photo
              };

          openRoom(
            room.id,
            otherUid,
            userData
          );

        } catch (error) {

          console.error(error);
        }
      };

      roomList.appendChild(div);
    });
  }


  /* =========================================================
     OPEN ROOM
     ========================================================= */

  function openRoom(roomId, uid, userData) {

    currentRoom = roomId;

    currentChatUser = {
      uid: uid,
      ...userData
    };

    app.classList.add("chat-open");

    chatName.textContent =
      userData.name ||
      userData.email ||
      "User";

    setAvatar(
      chatAvatar,
      userData.photoBase64,
      chatName.textContent
    );

    loadChatStatus(uid);
    loadMessages(roomId);

    if (messageInput) {
      setTimeout(() => {
        messageInput.focus();
      }, 100);
    }

    loadRooms();
  }


  /* =========================================================
     CHAT STATUS
     ========================================================= */

  function loadChatStatus(uid) {

    if (chatStatusListener) {
      chatStatusListener();
      chatStatusListener = null;
    }

    chatStatusListener =
      db
        .collection("users")
        .doc(uid)
        .onSnapshot(snapshot => {

          if (!snapshot.exists) {
            chatStatus.textContent = "";
            return;
          }

          const data = snapshot.data();

          if (data.online) {

            chatStatus.textContent = "online";

          } else {

            const lastSeen = data.lastSeen;

            if (
              lastSeen &&
              typeof lastSeen.toDate === "function"
            ) {

              chatStatus.textContent =
                "last seen " +
                formatLastSeen(
                  lastSeen.toDate()
                );

            } else {

              chatStatus.textContent =
                "offline";
            }
          }

          setAvatar(
            chatAvatar,
            data.photoBase64,
            data.name || "User"
          );
        });
  }


  function formatLastSeen(date) {

    return date.toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );
  }


  /* =========================================================
     CLOSE CHAT
     ========================================================= */

  function closeChat() {

    currentRoom = null;
    currentChatUser = null;

    if (messagesListener) {
      messagesListener();
      messagesListener = null;
    }

    if (chatStatusListener) {
      chatStatusListener();
      chatStatusListener = null;
    }

    messages.innerHTML = `
      <div class="welcome">
        <div class="welcome-icon">💬</div>
        <h2>Welcome to Chat Pro</h2>
        <p>Select a chat to start messaging.</p>
      </div>
    `;

    chatName.textContent = "Select a chat";
    chatStatus.textContent =
      "Start a conversation";

    setAvatar(
      chatAvatar,
      "",
      "User"
    );

    app.classList.remove("chat-open");
  }


  /* =========================================================
     LOAD MESSAGES
     ========================================================= */

  function loadMessages(roomId) {

    if (messagesListener) {
      messagesListener();
      messagesListener = null;
    }

    messages.innerHTML = "";

    messagesListener =
      db
        .collection("rooms")
        .doc(roomId)
        .collection("messages")
        .orderBy("createdAt", "asc")
        .onSnapshot(snapshot => {

          messages.innerHTML = "";

          snapshot.forEach(doc => {

            renderMessage(
              doc.id,
              doc.data()
            );
          });

          scrollMessages();

        }, error => {

          console.error(
            "Messages error:",
            error
          );
        });
  }


  /* =========================================================
     RENDER MESSAGE
     ========================================================= */

  function renderMessage(id, data) {

    const isMine =
      data.senderId === currentUser.uid;

    const div =
      document.createElement("div");

    div.className =
      "message " +
      (isMine ? "sent" : "received");

    div.dataset.id = id;

    let content = "";

    if (data.type === "image") {

      // data.imageBase64 contains the base64 data URL
      content = `
        <img
          class="message-image"
          src="${escapeAttribute(data.imageBase64 || "")}"
          alt="Image"
          loading="lazy"
        >
      `;

    } else if (data.type === "voice") {

      // data.voiceBase64 contains base64 audio data URL
      content = `
        <div class="voice-message">
          🎵
          <audio
            controls
            src="${escapeAttribute(data.voiceBase64 || "")}">
          </audio>
        </div>
      `;

    } else {

      content = `
        <div class="message-text">
          ${escapeHTML(data.text || "")}
        </div>
      `;
    }

    const time =
      data.createdAt &&
      typeof data.createdAt.toDate === "function"
        ? data.createdAt.toDate()
        : new Date();

    const readStatus =
      isMine
        ? `<span class="message-status">
             ${data.read ? "✓✓" : "✓"}
           </span>`
        : "";

    div.innerHTML = `
      ${content}

      <div class="message-time">
        ${formatTime(time)}
        ${readStatus}
      </div>
    `;

    if (isMine) {

      div.addEventListener(
        "contextmenu",
        event => {

          event.preventDefault();

          deleteMessage(id);
        }
      );
    }

    messages.appendChild(div);

    if (
      !isMine &&
      !data.read
    ) {

      markMessageRead(id);
    }
  }


  /* =========================================================
     SEND MESSAGE
     ========================================================= */

  async function sendMessage() {

    if (!currentUser) return;

    if (!currentRoom) {
      alert("Open a chat first.");
      return;
    }

    const text =
      messageInput.value.trim();

    if (!text) return;

    try {

      messageInput.value = "";

      const messageRef =

  /* =========================================================
     IMAGE COMPRESSION (FREE)
     ========================================================= */

  function compressImage(file, maxSize = 600, quality = 0.8) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxSize) {
              height = height * (maxSize / width);
              width = maxSize;
            }
          } else {
            if (height > maxSize) {
              width = width * (maxSize / height);
              height = maxSize;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(dataUrl);
        };
        img.onerror = reject;
      };
      reader.onerror = reject;
    });
  }


  /* =========================================================
     SEND IMAGE (Base64)
     ========================================================= */

  async function sendImage(file) {

    if (!file) return;

    if (!currentRoom) {
      alert("Open a chat first.");
      return;
    }

    if (!file.type.startsWith("image/")) {
      alert("Please choose an image.");
      return;
    }

    if (file.size > 10 * 1024 * 1024) {
      alert("Image must be smaller than 10 MB.");
      return;
    }

    try {

      // Compress to 600px JPEG
      const base64 = await compressImage(file, 600, 0.7);

      // Check size (Firestore limit 1 MiB)
      const approxSize = (base64.length * 3) / 4; // base64 -> bytes approx
      if (approxSize > 900 * 1024) {
        alert("Image too large after compression. Please choose a smaller image.");
        return;
      }

      await db
        .collection("rooms")
        .doc(currentRoom)
        .collection("messages")
        .add({

          senderId: currentUser.uid,
          type: "image",
          imageBase64: base64,
          read: false,

          createdAt:
            firebase.firestore.FieldValue.serverTimestamp()
        });

      await updateRoomLastMessage(

  /* =========================================================
     VOICE RECORDING (FREE - max 10 sec)
     ========================================================= */

  async function toggleRecording() {

    if (!currentRoom) {
      alert("Open a chat first.");
      return;
    }

    if (
      mediaRecorder &&
      mediaRecorder.state === "recording"
    ) {

      mediaRecorder.stop();

      if (recordBtn) {
        recordBtn.textContent = "🎤";
      }

      return;
    }

    try {

      localStream =
        await navigator.mediaDevices.getUserMedia({
          audio: true
        });

      audioChunks = [];

      mediaRecorder =
        new MediaRecorder(localStream);

      // Set max 10 seconds
      let recordingTimer = null;

      mediaRecorder.ondataavailable =
        event => {

          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

      mediaRecorder.onstop =
        async () => {

          if (recordingTimer) {
            clearTimeout(recordingTimer);
            recordingTimer = null;
          }

          const blob =
            new Blob(
              audioChunks,
              { type: "audio/webm" }
            );

          localStream
            .getTracks()
            .forEach(track => track.stop());

          localStream = null;

          await uploadVoiceBase64(blob);
        };

      mediaRecorder.start();

      // Stop automatically after 10 seconds
      recordingTimer = setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
          mediaRecorder.stop();
          if (recordBtn) {
            recordBtn.textContent = "🎤";
          }
        }
      }, 10000);

      if (recordBtn) {
        recordBtn.textContent = "⏹️";
      }

    } catch (error) {

      console.error(error);

      alert(
        "Microphone permission failed: " +
        error.message
      );
    }
  }


  async function uploadVoiceBase64(blob) {

    try {

      // Convert blob to base64
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
      });

      // Limit to ~1 MiB (Firestore limit)
      const approxSize = (base64.length * 3) / 4;
      if (approxSize > 900 * 1024) {
        alert("Voice message too long (max 10 seconds recommended).");
        return;
      }

      await db
        .collection("rooms")
        .doc(currentRoom)
        .collection("messages")
        .add({

          senderId: currentUser.uid,
          type: "voice",
          voiceBase64: base64,
          read: false,

          createdAt:
            firebase.firestore.FieldValue.serverTimestamp()
        });

      await updateRoomLastMessage(
        "🎤 Voice message",
        "voice"
      );

    } catch (error) {

      console.error(error);

      alert(
        "Voice upload failed: " +
        error.message
      );
    }
  }

  /* =========================================================
     START CALL
     ========================================================= */

  async function startCall(
    type,
    roomId,
    calleeId
  ) {

    if (activeCallId) {
      alert("You are already in a call.");
      return;
    }

    try {

      activeCallType = type;
      activeCallRoomId = roomId;
      activeCallRole = "caller";

      showCallScreen(
        type,
        "Calling...",
        "Connecting..."
      );

      const constraints =
        type === "video"
          ? {
              audio: true,
              video: true
            }
          : {
              audio: true,
              video: false
            };

      localStream =
        await navigator.mediaDevices
          .getUserMedia(constraints);

      setupLocalVideo(type);

      peerConnection =
        new RTCPeerConnection(
          rtcConfig
        );

      addLocalTracks();

      peerConnection.ontrack =
        event => {

          if (
            remoteVideo &&
            event.streams &&
            event.streams[0]
          ) {

            remoteVideo.srcObject =
              event.streams[0];

            remoteVideo.play()
              .catch(() => {});
          }
        };

      const callRef =
        db
          .collection("rooms")
          .doc(roomId)
          .collection("calls")
          .doc();

      activeCallRef = callRef;
      activeCallId = callRef.id;

      peerConnection.onicecandidate =
        async event => {

          if (!event.candidate) return;

          try {

            await callRef
              .collection("callerCandidates")
              .add(
                event.candidate.toJSON()
              );

          } catch (error) {

            console.error(error);
          }
        };

      const offer =
        await peerConnection.createOffer();

      await peerConnection.setLocalDescription(
        offer
      );

      await callRef.set({

        callerId: currentUser.uid,
        calleeId: calleeId,

        type: type,

        offer: {
          type: offer.type,
          sdp: offer.sdp
        },

        status: "ringing",

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

      listenForCallAnswer(callRef);

      listenForCalleeCandidates(
        callRef
      );

      setCallStatus(
        "Ringing..."
      );

    } catch (error) {

      console.error(
        "Start call error:",
        error
      );

      alert(
        "Could not start call: " +
        error.message
      );

      cleanupCall();
    }
  }

  /* =========================================================
     CALLER: LISTEN FOR ANSWER
     ========================================================= */

  function listenForCallAnswer(
    callRef
  ) {

    if (callDocListener) {
      callDocListener();
    }

    callDocListener =
      callRef.onSnapshot(
        async snapshot => {

          if (!snapshot.exists) return;

          const data =
            snapshot.data();

          if (
            data.answer &&
            peerConnection &&
            !peerConnection.currentRemoteDescription
          ) {

            try {

              await peerConnection.setRemoteDescription(
                new RTCSessionDescription(
                  data.answer
                )
              );

              setCallStatus(
                "Connected"
              );

            } catch (error) {

              console.error(
                "Answer error:",
                error
              );
            }
          }

          if (
            data.status === "rejected"
          ) {

            alert("Call rejected.");

            cleanupCall();
          }

          if (
            data.status === "ended"
          ) {

            cleanupCall();
          }
        }
      );
  }


  /* =========================================================
     LISTEN CALLEE ICE
     ========================================================= */

  function listenForCalleeCandidates(
    callRef
  ) {

    if (calleeCandidateListener) {
      calleeCandidateListener();
    }

    calleeCandidateListener =
      callRef
        .collection("calleeCandidates")
        .onSnapshot(snapshot => {

          snapshot.docChanges()
            .forEach(async change => {

              if (
                change.type !== "added" ||
                !peerConnection
              ) return;

              try {

                await peerConnection.addIceCandidate(
                  new RTCIceCandidate(
                    change.doc.data()
                  )
                );

              } catch (error) {

                console.error(
                  "ICE error:",
                  error
                );
              }
            });
        });
  }


  /* =========================================================
     INCOMING CALL LISTENER
     ========================================================= */

  function listenForIncomingCalls() {

    if (!currentUser) return;

    db
      .collection("rooms")
      .where(
        "participants",
        "array-contains",
        currentUser.uid
      )
      .onSnapshot(snapshot => {

        snapshot.forEach(roomDoc => {

          const roomId =
            roomDoc.id;

          if (
            incomingRoomListeners[roomId]
          ) return;

          const listener =
            db
              .collection("rooms")
              .doc(roomId)
              .collection("calls")
              .where(
                "calleeId",
                "==",
                currentUser.uid
              )
              .onSnapshot(
                callSnapshot => {

                  callSnapshot.docChanges()
                    .forEach(change => {

                      if (
                        change.type !== "added"
                      ) return;

                      const callId =
                        change.doc.id;

                      const data =
                        change.doc.data();

                      if (
                        data.status !==
                        "ringing"
                      ) return;

                      if (
                        handledIncomingCalls.has(
                          callId
                        )
                      ) return;

                      if (
                        activeCallId
                      ) return;

                      handledIncomingCalls.add(
                        callId
                      );

                      handleIncomingCall(
                        roomId,
                        callId,
                        data
                      );
                    });
                }
              );

          incomingRoomListeners[roomId] =
            listener;
        });

      }, error => {

        console.error(
          "Incoming calls error:",
          error
        );
      });
  }


  /* =========================================================
     HANDLE INCOMING CALL
     ========================================================= */

  async function handleIncomingCall(
    roomId,
    callId,
    data
  ) {

    if (activeCallId) return;

    const callerId =
      data.callerId;

    let callerName =
      "User";

    try {

      const userSnap =
        await db
          .collection("users")
          .doc(callerId)
          .get();

      if (userSnap.exists) {

        callerName =
          userSnap.data().name ||
          "User";
      }

    } catch (error) {
      console.error(error);
    }

    const type =
      data.type === "video"
        ? "video"
        : "audio";

    const answer =
      confirm(
        `Incoming ${type} call from ${callerName}.\n\nAccept?`
      );

    if (!answer) {

      await db
        .collection("rooms")
        .doc(roomId)
        .collection("calls")
        .doc(callId)
        .update({
          status: "rejected"
        });

      return;
    }

    await acceptIncomingCall(
      roomId,
      callId,
      data,
      callerName
    );
  }


  /* =========================================================
     ACCEPT INCOMING CALL
     ========================================================= */

  async function acceptIncomingCall(
    roomId,
    callId,
    data,
    callerName
  ) {

    try {

      activeCallId = callId;
      activeCallRoomId = roomId;
      activeCallRole = "callee";
      activeCallType =
        data.type === "video"
          ? "video"
          : "audio";

      activeCallRef =
        db
          .collection("rooms")
          .doc(roomId)
          .collection("calls")
          .doc(callId);

      showCallScreen(
        activeCallType,
        callerName,
        "Connecting..."
      );

      const constraints =
        activeCallType === "video"
          ? {
              audio: true,
              video: true
            }
          : {
              audio: true,
              video: false
            };

      localStream =
        await navigator.mediaDevices
          .getUserMedia(
            constraints
          );

      setupLocalVideo(
        activeCallType
      );

      peerConnection =
        new RTCPeerConnection(
          rtcConfig
        );

      addLocalTracks();

      peerConnection.ontrack =
        event => {

          if (
            remoteVideo &&
            event.streams &&
            event.streams[0]
          ) {

            remoteVideo.srcObject =
              event.streams[0];

            remoteVideo.play()
              .catch(() => {});
          }
        };

      peerConnection.onicecandidate =
        async event => {

          if (!event.candidate) return;

          try {

            await activeCallRef
              .collection(
                "calleeCandidates"
              )
              .add(
                event.candidate.toJSON()
              );

          } catch (error) {

            console.error(error);
          }
        };

      await peerConnection.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

      listenForCallerCandidates(
        activeCallRef
      );

      const answer =
        await peerConnection.createAnswer();

      await peerConnection.setLocalDescription(
        answer
      );

      await activeCallRef.update({

        answer: {
          type: answer.type,
          sdp: answer.sdp
        },

        status: "accepted"

      });

      listenForCallEnd(
        activeCallRef
      );

      setCallStatus(
        "Connected"
      );

    } catch (error) {

      console.error(
        "Accept call error:",
        error
      );

      alert(
        "Could not answer call: " +
        error.message
      );

      cleanupCall();
    }
  }

  /* =========================================================

  function listenForCallEnd(
    callRef
  ) {

    if (callDocListener) {
      callDocListener();

    callDocListener =
      callRef.onSnapshot(
        snapshot => {

          if (!snapshot.exists) {
            cleanupCall();

          const data =

  /* =========================================================
     END CALL
     ========================================================= */

  async function endCall() {

    try {

      if (activeCallRef) {

        await activeCallRef.update({
          status: "ended",
          endedAt:
            firebase.firestore.FieldValue.serverTimestamp()
        });
      }

    } catch (error) {

      console.error(
        "End call error:",
        error
      );

    } finally {

      cleanupCall();
    }
  }


  /* =========================================================
     CLEANUP CALL
     ========================================================= */

  function cleanupCall() {

    if (callDocListener) {
      callDocListener();
      callDocListener = null;
    }

    if (callerCandidateListener) {
      callerCandidateListener();
      callerCandidateListener = null;
    }

    if (calleeCandidateListener) {
      calleeCandidateListener();
      calleeCandidateListener = null;
    }

    if (peerConnection) {

      peerConnection.ontrack = null;
      peerConnection.onicecandidate = null;

      peerConnection.close();
      peerConnection = null;
    }

    if (localStream) {

      localStream
        .getTracks()
        .forEach(track => {
          track.stop();
        });

      localStream = null;
    }

    if (remoteVideo) {
      remoteVideo.srcObject = null;
    }

    if (localVideo) {
      localVideo.srcObject = null;
    }

    activeCallId = null;
    activeCallRoomId = null;
    activeCallType = null;
    activeCallRole = null;
    activeCallRef = null;

    isMuted = false;
    cameraEnabled = true;

    if (callScreen) {
      callScreen.classList.add(
        "hidden"
      );
    }

    if (localVideo) {
      localVideo.style.display = "block";
    }

    if (remoteVideo) {
      remoteVideo.style.display = "block";
    }
  }


  /* =========================================================
     MUTE
     ========================================================= */

  function toggleMute() {

    if (!localStream) return;

    const audioTracks =
      localStream.getAudioTracks();

    if (!audioTracks.length) return;

    isMuted = !isMuted;

    audioTracks.forEach(track => {
      track.enabled = !isMuted;
    });

    const button =
      document.getElementById(
        "muteBtn"
      );

    if (button) {
      button.textContent =
        isMuted ? "🔇" : "🎤";
    }
  }


  /* =========================================================
     CAMERA
     ========================================================= */

  function toggleCamera() {

    if (!localStream) return;

    const videoTracks =
      localStream.getVideoTracks();

    if (!videoTracks.length) return;

    cameraEnabled =
      !cameraEnabled;

    videoTracks.forEach(track => {
      track.enabled =
        cameraEnabled;
    });

    const button =
      document.getElementById(
        "cameraBtn"
      );

    if (button) {
      button.textContent =
        cameraEnabled
          ? "📷"
          : "🚫";
    }
  }


  /* =========================================================
     CLEANUP LISTENERS
     ========================================================= */

  function cleanupListeners() {

    if (roomsListener) {
      roomsListener();
      roomsListener = null;
    }

    if (messagesListener) {
      messagesListener();
      messagesListener = null;
    }

    if (profileListener) {
      profileListener();
      profileListener = null;
    }

    if (chatStatusListener) {
      chatStatusListener();
      chatStatusListener = null;
    }

    if (onlineInterval) {
      clearInterval(
        onlineInterval
      );

      onlineInterval = null;
    }

    Object.keys(
      incomingRoomListeners
    ).forEach(roomId => {

      try {
        incomingRoomListeners[roomId]();
      } catch (error) {
        console.error(error);
      }
    });

    incomingRoomListeners = {};
    handledIncomingCalls.clear();
  }


  /* =========================================================
     SCROLL
     ========================================================= */

  function scrollMessages() {

    if (!messages) return;

    messages.scrollTop =
      messages.scrollHeight;
  }


  /* =========================================================
     FORMAT TIME
     ========================================================= */

  function formatTime(date) {

    if (!date) return "";

    return date.toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );
  }


  /* =========================================================
     ESCAPE HTML
     ========================================================= */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function escapeAttribute(value) {

    return escapeHTML(value);
  }


  /* =========================================================
     INITIAL AVATARS
     ========================================================= */

  setAvatar(
    myAvatar,
    "",
    "User"
  );

  setAvatar(
    profileAvatar,
    "",
    "User"
  );

  setAvatar(
    chatAvatar,
    "",
    "User"
  );


  /* =========================================================
     GLOBAL FUNCTIONS
     ========================================================= */

  window.signup = signup;
  window.login = login;
  window.logout = logout;

  window.createRoom = createRoom;
  window.openProfile = openProfile;
  window.closeProfile = closeProfile;
  window.changeProfilePicture =
    changeProfilePicture;

  window.openRoom = openRoom;
  window.closeChat = closeChat;

  window.sendMessage = sendMessage;
  window.deleteMessage = deleteMessage;
  window.sendImage = sendImage;

  window.toggleRecording =
    toggleRecording;

  window.toggleEmojiPicker =
    toggleEmojiPicker;

  window.toggleDarkMode =
    toggleDarkMode;

  window.searchUsers =
    searchUsers;

  window.openChatMenu =
    openChatMenu;

  window.clearMessages =
    clearMessages;

  window.startAudioCall =
    startAudioCall;

  window.startVideoCall =
    startVideoCall;

  window.endCall =
    endCall;

  window.toggleMute =
    toggleMute;

  window.toggleCamera =
    toggleCamera;

</script>
