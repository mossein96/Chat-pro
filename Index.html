<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Chat Pro</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
    }

    header {
      background: #1f1f1f;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    #chat {
      height: 70vh;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      background: #2a2a2a;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
    }

    .input-area {
      display: flex;
      padding: 15px;
      background: #1f1f1f;
      position: fixed;
      bottom: 0;
      width: 100%;
      box-sizing: border-box;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: none;
      font-size: 16px;
    }

    button {
      margin-left: 10px;
      padding: 12px 18px;
      border: none;
      border-radius: 20px;
      background: #25D366;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>Chat Pro</header>

  <div id="chat">
    <div class="message">
      Welcome to Chat Pro! 👋
    </div>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="messageInput"
      placeholder="Type a message..."
    >

    <button onclick="sendMessage()">
      Send
    </button>
  </div>

  <script src="app.js"></script>

</body>
</html>
