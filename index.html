<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
    }

    header {
      background: #1f1f1f;
      padding: 20px;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      color: #4caf50;
    }

    .subtitle {
      text-align: center;
      color: #cccccc;
      margin-bottom: 30px;
    }

    #chat {
      height: 500px;
      overflow-y: auto;
      background: #202020;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .message {
      padding: 15px;
      margin: 12px 0;
      border-radius: 18px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .assistant {
      background: #333333;
      margin-right: auto;
    }

    .user {
      background: #2e7d32;
      margin-left: auto;
      text-align: right;
    }

    .input-area {
      display: flex;
      gap: 12px;
    }

    input {
      flex: 1;
      padding: 18px;
      font-size: 18px;
      border-radius: 15px;
      border: none;
    }

    button {
      padding: 18px 25px;
      font-size: 18px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    footer {
      text-align: center;
      color: #888;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<header>💬 Chat Pro</header>

<div class="container">

  <h1>Welcome to Chat Pro</h1>

  <p class="subtitle">
    Chat with your personal AI assistant.
  </p>

  <div id="chat">
    <div class="message assistant">
      Hello! 👋 Welcome to Chat Pro. How can I help you today?
    </div>
  </div>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Type your message..."
    >

    <button id="sendButton" onclick="sendMessage()">
      Send
    </button>
  </div>

  <footer>
    Chat Pro © 2026
  </footer>

</div>

<script>

async function sendMessage() {

  const input = document.getElementById("messageInput");
  const chat = document.getElementById("chat");
  const button = document.getElementById("sendButton");

  const message = input.value.trim();

  if (!message) return;

  chat.innerHTML += `
    <div class="message user">
      ${escapeHtml(message)}
    </div>
  `;

  input.value = "";

  button.disabled = true;
  button.innerText = "Thinking...";

  chat.scrollTop = chat.scrollHeight;

  try {

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong");
    }

    chat.innerHTML += `
      <div class="message assistant">
        ${escapeHtml(data.reply)}
      </div>
    `;

  } catch (error) {

    chat.innerHTML += `
      <div class="message assistant">
        ⚠️ Error: ${escapeHtml(error.message)}
      </div>
    `;

  }

  button.disabled = false;
  button.innerText = "Send";

  chat.scrollTop = chat.scrollHeight;
}


document.getElementById("messageInput")
.addEventListener("keypress", function(event) {

  if (event.key === "Enter") {
    sendMessage();
  }

});


function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
  </html>
