<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Chat Pro - AI Assistant</title>


  <link
    rel="manifest"
    href="/manifest.json"
  >


  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="/icon-192.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="/icon-512.png"
  >

  <link
    rel="apple-touch-icon"
    href="/icon-192.png"
  >


  <meta
    name="theme-color"
    content="#121212"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
    }


    header {
      background: #1f1f1f;
      padding: 20px;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
    }


    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 20px;
    }


    h1 {
      text-align: center;
      color: #4caf50;
    }


    .subtitle {
      text-align: center;
      color: #cccccc;
      margin-bottom: 20px;
    }


    #chat {
      height: 500px;
      overflow-y: auto;
      background: #202020;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
    }


    .message {
      padding: 15px;
      margin: 12px 0;
      border-radius: 18px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }


    .assistant {
      background: #333333;
      margin-right: auto;
    }


    .user {
      background: #2e7d32;
      margin-left: auto;
      text-align: right;
    }


    .file-preview {
      display: none;
      background: #292929;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 10px;
      color: #dddddd;
      font-size: 14px;
    }


    .file-preview button {
      margin-left: 10px;
      background: transparent;
      border: none;
      color: #ff7777;
      font-size: 18px;
      cursor: pointer;
    }


    .input-area {
      display: flex;
      gap: 10px;
      align-items: center;
    }


    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 18px;
      font-size: 18px;
      border-radius: 15px;
      border: none;
    }


    .attach-button {
      width: 58px;
      height: 58px;
      font-size: 24px;
      background: #333333;
      color: white;
      border: none;
      border-radius: 15px;
      cursor: pointer;
    }


    .send-button {
      padding: 18px 25px;
      font-size: 18px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 15px;
      cursor: pointer;
    }


    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    footer {
      text-align: center;
      color: #888888;
      margin-top: 30px;
    }


    @media (max-width: 500px) {

      .container {
        padding: 20px 15px;
      }


      #chat {
        height: 450px;
      }


      .input-area {
        gap: 8px;
      }


      #messageInput {
        font-size: 16px;
        padding: 16px 12px;
      }


      .attach-button {
        width: 52px;
        height: 52px;
      }


      .send-button {
        padding: 16px;
        font-size: 16px;
      }

    }

  </style>

</head>


<body>


<header>
  💬 Chat Pro
</header>


<div class="container">


  <h1>
    Welcome to Chat Pro
  </h1>


  <p class="subtitle">
    Chat with your AI assistant.
  </p>



  <div id="chat">

    <div class="message assistant">
      Hello! 👋 Welcome to Chat Pro. You can now attach a file or send me a message.
    </div>

  </div>



  <div
    id="filePreview"
    class="file-preview"
  >

    <span id="fileName"></span>

    <button
      type="button"
      onclick="removeFile()"
    >
      ✕
    </button>

  </div>



  <div class="input-area">


    <input
      id="fileInput"
      type="file"
      hidden
      onchange="handleFileSelect(event)"
    >


    <button
      id="attachButton"
      class="attach-button"
      type="button"
      onclick="document.getElementById('fileInput').click()"
      title="Attach file"
    >
      📎
    </button>



    <input
      id="messageInput"
      type="text"
      placeholder="Type your message..."
      autocomplete="off"
    >



    <button
      id="sendButton"
      class="send-button"
      onclick="sendMessage()"
    >
      Send
    </button>


  </div>



  <footer>
    Chat Pro © 2026
  </footer>


</div>



<script>


let selectedFile = null;


function addMessage(text, type) {

  const chat =
    document.getElementById("chat");


  const message =
    document.createElement("div");


  message.className =
    type === "user"
      ? "message user"
      : "message assistant";


  message.textContent = text;


  chat.appendChild(message);


  chat.scrollTop =
    chat.scrollHeight;


  return message;

}



function handleFileSelect(event) {

  const file =
    event.target.files[0];


  if (!file) {
    return;
  }


  const maxSize =
    10 * 1024 * 1024;


  if (file.size > maxSize) {

    alert(
      "Please choose a file smaller than 10 MB."
    );

    event.target.value = "";

    return;

  }


  selectedFile = file;


  document
    .getElementById("fileName")
    .textContent =
      "📎 " +
      file.name;


  document
    .getElementById("filePreview")
    .style.display =
      "block";

}



function removeFile() {

  selectedFile = null;


  document
    .getElementById("fileInput")
    .value =
      "";


  document
    .getElementById("filePreview")
    .style.display =
      "none";

}



function fileToBase64(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          resolve(
            reader.result
          );

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Could not read the file"
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}



async function sendMessage() {


  const input =
    document.getElementById(
      "messageInput"
    );


  const button =
    document.getElementById(
      "sendButton"
    );


  const attachButton =
    document.getElementById(
      "attachButton"
    );


  const message =
    input.value.trim();


  if (
    !message &&
    !selectedFile
  ) {

    return;

  }



  let userText =
    message;


  if (selectedFile) {

    userText +=
      (
        userText
          ? "\n\n"
          : ""
      ) +
      "📎 Attached: " +
      selectedFile.name;

  }



  addMessage(
    userText,
    "user"
  );



  const fileToSend =
    selectedFile;



  input.value = "";


  removeFile();



  input.disabled = true;


  button.disabled = true;


  attachButton.disabled = true;


  button.innerText =
    "Thinking...";



  const thinkingMessage =
    addMessage(
      "Chat Pro is thinking... 🤖",
      "assistant"
    );



  try {


    let fileData =
      null;



    if (fileToSend) {

      const base64Data =
        await fileToBase64(
          fileToSend
        );


      fileData = {

        name:
          fileToSend.name,

        type:
          fileToSend.type,

        data:
          base64Data

      };

    }



    const response =
      await fetch(
        "/api/chat",
        {

          method:
            "POST",


          headers: {

            "Content-Type":
              "application/json"

          },


          body:
            JSON.stringify({

              message:
                message,

              file:
                fileData

            })

        }
      );



    const data =
      await response.json();



    if (thinkingMessage) {

      thinkingMessage.remove();

    }



    if (!response.ok) {

      throw new Error(
        data.error ||
        "Something went wrong"
      );

    }



    addMessage(
      data.reply ||
      "Sorry, I could not generate a reply.",
      "assistant"
    );


  } catch (error) {


    if (thinkingMessage) {

      thinkingMessage.remove();

    }



    addMessage(
      "⚠️ Error: " +
      (
        error.message ||
        "Something went wrong"
      ),
      "assistant"
    );


  }



  input.disabled =
    false;


  button.disabled =
    false;


  attachButton.disabled =
    false;


  button.innerText =
    "Send";


  input.focus();


}



document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


</script>


</body>

    </html>
